name: temporary Guardian sticky quota regression fix

on:
  push:
    branches:
      - fix/codex-free-guardian-routing

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/codex-free-guardian-routing
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Patch Guardian sticky quota handling
        run: python3 .github/tmp_guardian_sticky_patch.py
      - name: Format changed Go files
        run: gofmt -w backend/internal/service/openai_guardian_route.go backend/internal/service/openai_guardian_route_test.go backend/internal/service/openai_account_scheduler.go
      - name: Focused Guardian tests
        working-directory: backend
        run: go test ./internal/service -run 'TestOpenAICodexGuardian' -count=1
      - name: Handler and service regression suites
        working-directory: backend
        run: go test ./internal/handler ./internal/service -count=1
      - name: Publish tested staging tree
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/tmp-guardian-sticky-quota.yml .github/tmp_guardian_sticky_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/service/openai_guardian_route.go backend/internal/service/openai_guardian_route_test.go backend/internal/service/openai_account_scheduler.go
          git commit -m "fix(codex): keep Guardian sticky account through normal quota"
          git push origin HEAD:fix/codex-free-guardian-routing
