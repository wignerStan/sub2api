name: codex-wire-audit

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - name: Run wire tool self-tests
        run: |
          python3 scripts/codex_wire_audit.py --self-test
          python3 scripts/dummy_codex_server.py --self-test

      - name: Fetch and generate latest upstream Codex wire schema snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/codex_wire_audit.py --json --output scripts/codex_wire_snapshot.json
          mkdir -p rustsidecar/tests/fixtures
          cp scripts/codex_wire_snapshot.json rustsidecar/tests/fixtures/codex_wire_snapshot.json

      - name: Test sidecar exact snapshot fidelity against updated schema
        working-directory: rustsidecar
        run: |
          cargo test

      - name: Check for snapshot schema changes
        id: git-diff
        run: |
          if git diff --quiet scripts/codex_wire_snapshot.json rustsidecar/tests/fixtures/codex_wire_snapshot.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "Upstream Codex wire snapshot is up to date."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Detected upstream Codex wire schema changes!"
          fi

      - name: Commit and update snapshot schema
        if: steps.git-diff.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/codex_wire_snapshot.json rustsidecar/tests/fixtures/codex_wire_snapshot.json
          git commit -m "chore(audit): update upstream Codex wire snapshot [$(date -u +'%Y-%m-%d')]"
          git push
