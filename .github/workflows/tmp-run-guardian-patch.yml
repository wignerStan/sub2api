name: run staged Guardian routing patch

on:
  push:
    branches:
      - fix/codex-free-guardian-routing

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/codex-free-guardian-routing
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Extract and apply staged patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/tmp-free-guardian-routing.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          prefix = '          '
          out = [line[len(prefix):] if line.startswith(prefix) else line for line in source[start:end]]
          script = '\n'.join(out) + '\n'

          stale = (
              "replace_once(\n"
              "    p,\n"
              "    '\\t\\t\"x-codex-installation-id\",\\n\\t\\t\"session-id\",\\n',\n"
              "    '\\t\\t\"x-codex-installation-id\",\\n'\n"
              "    '\\t\\t\"x-codex-parent-thread-id\",\\n'\n"
              "    '\\t\\t\"x-openai-subagent\",\\n'\n"
              "    '\\t\\t\"x-openai-internal-codex-responses-lite\",\\n'\n"
              "    '\\t\\t\"session-id\",\\n',\n"
              ")"
          )
          fixed = (
              "replace_once(\n"
              "    p,\n"
              "    '\\t\\t\\t\"x-codex-installation-id\",\\n',\n"
              "    '\\t\\t\\t\"x-codex-installation-id\",\\n'\n"
              "    '\\t\\t\\t\"x-codex-parent-thread-id\",\\n'\n"
              "    '\\t\\t\\t\"x-openai-subagent\",\\n'\n"
              "    '\\t\\t\\t\"x-openai-internal-codex-responses-lite\",\\n',\n"
              ")"
          )
          if stale not in script:
              raise SystemExit('staged script header anchor rewrite not found')
          script = script.replace(stale, fixed, 1)

          old_signature = '"func (s *OpenAIGatewayService) buildOpenAIResponsesWSURL(ctx context.Context, account *Account) (string, error) {"'
          new_signature = r'"func (s *OpenAIGatewayService) buildOpenAIResponsesWSURL(account *Account) (string, error) {\n\treturn s.buildOpenAIResponsesWSURLForContext(context.Background(), account)\n}\n\nfunc (s *OpenAIGatewayService) buildOpenAIResponsesWSURLForContext(ctx context.Context, account *Account) (string, error) {"'
          if script.count(old_signature) != 1:
              raise SystemExit(f'context-aware WS helper signature anchor count={script.count(old_signature)}')
          script = script.replace(old_signature, new_signature, 1)

          old_call = '"buildOpenAIResponsesWSURL(ctx, account)"'
          new_call = '"buildOpenAIResponsesWSURLForContext(ctx, account)"'
          if script.count(old_call) != 1:
              raise SystemExit(f'context-aware WS helper call anchor count={script.count(old_call)}')
          script = script.replace(old_call, new_call, 1)

          Path('/tmp/apply_guardian.py').write_text(script)
          PY
          python3 /tmp/apply_guardian.py

      - name: Format changed sources
        shell: bash
        run: |
          gofmt -w \
            backend/internal/service/openai_guardian_route.go \
            backend/internal/service/openai_guardian_route_test.go \
            backend/internal/service/openai_gateway_service.go \
            backend/internal/service/openai_gateway_forward.go \
            backend/internal/service/openai_gateway_passthrough.go \
            backend/internal/service/openai_ws_forwarder_payload.go \
            backend/internal/service/openai_ws_forwarder_v2.go \
            backend/internal/service/openai_ws_forwarder_ingress.go \
            backend/internal/service/openai_ws_v2_passthrough_adapter.go \
            backend/internal/service/openai_gateway_scheduling.go \
            backend/internal/service/openai_account_scheduler.go \
            backend/internal/service/openai_account_runtime_block_fastpath.go \
            backend/internal/handler/openai_gateway_handler.go
          cargo fmt --manifest-path rustsidecar/Cargo.toml

      - name: Focused Guardian tests
        working-directory: backend
        run: go test ./internal/service -run 'TestOpenAICodexGuardian' -count=1

      - name: Handler and service regression suites
        working-directory: backend
        run: go test ./internal/handler ./internal/service -count=1

      - name: Sidecar tests
        run: cargo test --manifest-path rustsidecar/Cargo.toml --bin sub2api-sidecar

      - name: Verify and publish tested tree
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/tmp-free-guardian-routing.yml .github/workflows/tmp-run-guardian-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend rustsidecar
          git commit -m "fix(codex): route verified Guardian traffic to free endpoints"
          git push origin HEAD:fix/codex-free-guardian-routing
