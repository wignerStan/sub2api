name: temporary Codex WebSocket CI expectation update

on:
  push:
    branches:
      - fix/codex-ws-preserve-upstream-error

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-ws-preserve-upstream-error
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Update credential-failover wire expectation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("backend/internal/handler/openai_gateway_credential_failover_loop_test.go")
          text = path.read_text()
          old = '''		readCtx, cancel := context.WithTimeout(context.Background(), 3*time.Second)
          		_, _, err := conn.Read(readCtx)
          		cancel()
          		var closeErr coderws.CloseError
          		require.ErrorAs(t, err, &closeErr)
          		require.Contains(t, closeErr.Reason, service.GrokCredentialUnavailableClientMessage)
          '''
          new = '''		readCtx, cancel := context.WithTimeout(context.Background(), 3*time.Second)
          		msgType, payload, err := conn.Read(readCtx)
          		require.NoError(t, err)
          		require.Equal(t, coderws.MessageText, msgType)
          		event := decodeOpenAIWSFailoverErrorEvent(t, payload)
          		require.Equal(t, "error", event.Type)
          		require.Equal(t, http.StatusServiceUnavailable, event.Status)
          		var eventError struct {
          			Message string `json:"message"`
          		}
          		require.NoError(t, json.Unmarshal(event.Error, &eventError))
          		require.Contains(t, eventError.Message, service.GrokCredentialUnavailableClientMessage)

          		_, _, err = conn.Read(readCtx)
          		cancel()
          		var closeErr coderws.CloseError
          		require.ErrorAs(t, err, &closeErr)
          		require.Contains(t, closeErr.Reason, service.GrokCredentialUnavailableClientMessage)
          '''
          if text.count(old) != 1:
              raise SystemExit(f"credential failover test anchor count={text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

          gofmt -w backend/internal/handler/openai_gateway_credential_failover_loop_test.go
          git diff --check

      - name: Run focused wire-order regression
        working-directory: backend
        run: |
          go test -tags=unit ./internal/handler \
            -run 'TestResponsesWebSocketCredentialFailoverLoop/provider_configuration_stops' \
            -count=1

      - name: Run focused Codex terminal-error regressions
        working-directory: backend
        run: |
          go test ./internal/service \
            -run 'TestNewOpenAIWSDialRateLimitFailoverError' \
            -count=1
          go test ./internal/handler \
            -run 'Test(BuildOpenAIWSFailoverErrorEvent|CloseOpenAIWSFailoverExhausted)' \
            -count=1

      - name: Run repository unit suite
        working-directory: backend
        run: go test -tags=unit ./...

      - name: Commit tested tree and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-codex-ws-ci-expectation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(gateway): expect terminal WebSocket error before close"
          git push origin HEAD:fix/codex-ws-preserve-upstream-error
