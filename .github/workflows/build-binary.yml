name: Build Binary (patched)

on:
  push:
    branches: [fix/persistent-rate-limit-block]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Verify frontend dist
        run: ls -la backend/internal/web/dist/ | head
      - name: Stamp VERSION from nearest upstream tag
        run: |
          # The branch tracks an upstream release tag (v0.1.x). Embed that
          # version (e.g. 0.1.149) so the binary reports it correctly.
          git fetch --tags https://github.com/Wei-Shaw/sub2api.git 2>/dev/null || true
          VER=$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null | sed -E 's/^v//; s/-.*//' || true)
          [ -z "$VER" ] && VER=$(grep -m1 -E '^v?[0-9]+\.[0-9]+\.[0-9]+' backend/cmd/server/VERSION | sed -E 's/^v//' || echo "0.0.0-dev")
          echo "$VER" > backend/cmd/server/VERSION
          echo "VERSION=$(cat backend/cmd/server/VERSION)"
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build backend (with embedded frontend)
        working-directory: backend
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 go build -trimpath -tags embed -ldflags="-s -w" -o ../dist/sub2api ./cmd/server
      - name: Verify
        run: file dist/sub2api && ls -la dist/sub2api
      - uses: actions/upload-artifact@v4
        with:
          name: sub2api-patched
          path: dist/sub2api
          if-no-files-found: error
          retention-days: 14
