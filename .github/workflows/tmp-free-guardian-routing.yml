name: temporary free Guardian routing fix

on:
  push:
    branches:
      - fix/codex-free-guardian-routing

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]' || github.event.head_commit.message == 'chore: stage free Guardian routing fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/codex-free-guardian-routing
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Apply Guardian compatibility patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 occurrence, found {count}: {old[:100]!r}")
              write(path, text.replace(old, new, 1))

          def replace_all(path, old, new, minimum=1):
              text = read(path)
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"{path}: expected >= {minimum} occurrences, found {count}: {old[:100]!r}")
              write(path, text.replace(old, new))

          p = "backend/internal/service/openai_gateway_service.go"
          replace_once(
              p,
              '\tchatgptCodexURL = "https://chatgpt.com/backend-api/codex/responses"\n',
              '\tchatgptCodexURL                   = "https://chatgpt.com/backend-api/codex/responses"\n'
              '\tchatgptCodexGuardianURL           = "https://chatgpt.com/backend-api/codex/guardian"\n'
              '\tchatgptCodexGuardianClassifierURL = "https://chatgpt.com/backend-api/codex/guardian-classifier"\n',
          )
          replace_all(
              p,
              '\t"x-codex-window-id":       true,\n\tresponsesLiteHeaderKey:    true,\n',
              '\t"x-codex-window-id":        true,\n'
              '\t"x-codex-parent-thread-id": true,\n'
              '\t"x-openai-subagent":         true,\n'
              '\tresponsesLiteHeaderKey:      true,\n',
              minimum=2,
          )
          text = read(p)
          pattern = r'(\topenaiAccountRuntimeBlockUntil\s+sync\.Map[^\n]*\n)'
          if len(re.findall(pattern, text)) != 1:
              raise SystemExit("openai_gateway_service.go: runtime block map anchor mismatch")
          text = re.sub(
              pattern,
              r'\1\topenaiAccountRuntimeBlockReason     sync.Map // key: account ID, value: strongest active block reason\n',
              text,
              count=1,
          )
          write(p, text)

          guardian_route = r'''package service

