name: apply-codex-trusted-response-policy

on:
  push:
    branches:
      - fix/codex-quota-egress-isolation

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/codex-quota-egress-isolation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply trusted-hop response policy and audit completeness fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('rustsidecar/src/main.rs')
          text = main_path.read_text()
          start = text.index('const ALLOWED_CLIENT_RESPONSE_HEADERS:')
          end = text.index('async fn http_tunnel(', start)
          replacement = r'''const ALLOWED_TUNNEL_RESPONSE_HEADERS: &[&str] = &[
              "content-type",
              "content-language",
              "cache-control",
              "etag",
              "last-modified",
              "expires",
              "vary",
              "date",
              "retry-after",
              "location",
              "www-authenticate",
              "x-request-id",
              "x-oai-request-id",
              "x-ratelimit-limit-requests",
              "x-ratelimit-limit-tokens",
              "x-ratelimit-remaining-requests",
              "x-ratelimit-remaining-tokens",
              "x-ratelimit-reset-requests",
              "x-ratelimit-reset-tokens",
              "x-reasoning-included",
              "openai-model",
              "x-models-etag",
              "x-codex-turn-state",
              "x-codex-safety-buffering-enabled",
              "x-codex-safety-buffering-faster-model",
          ];

          // These headers are trusted metadata for the Rust->Go loopback hop.
          // They may be needed for scheduler/failover/error classification, but
          // the public Go egress must not expose provider-account quota state.
          const INTERNAL_ONLY_TUNNEL_RESPONSE_HEADERS: &[&str] = &[
              "x-codex-active-limit",
              "x-codex-credits-has-credits",
              "x-codex-credits-unlimited",
              "x-codex-credits-balance",
              "x-codex-promo-message",
              "x-codex-rate-limit-reached-type",
              "cf-ray",
              "x-openai-authorization-error",
              "x-error-json",
          ];

          const EXPLICITLY_STRIPPED_TUNNEL_RESPONSE_HEADERS: &[&str] = &[
              "set-cookie",
              "cf-cache-status",
              "x-envoy-upstream-service-time",
              "x-openai-backend",
              "x-codex-routing-hint",
          ];

          const EXACT_CODEX_QUOTA_RESPONSE_HEADERS: &[&str] = &[
              "x-codex-active-limit",
              "x-codex-credits-has-credits",
              "x-codex-credits-unlimited",
              "x-codex-credits-balance",
              "x-codex-promo-message",
              "x-codex-rate-limit-reached-type",
          ];

          const CODEX_QUOTA_RESPONSE_HEADER_SUFFIXES: &[&str] = &[
              "-primary-used-percent",
              "-primary-window-minutes",
              "-primary-reset-at",
              "-secondary-used-percent",
              "-secondary-window-minutes",
              "-secondary-reset-at",
              "-limit-name",
          ];

          #[cfg(test)]
          const CODEX_QUOTA_RESPONSE_HEADER_PATTERNS: &[&str] = &[
              "x-<limit-id>-primary-used-percent",
              "x-<limit-id>-primary-window-minutes",
              "x-<limit-id>-primary-reset-at",
              "x-<limit-id>-secondary-used-percent",
              "x-<limit-id>-secondary-window-minutes",
              "x-<limit-id>-secondary-reset-at",
              "x-<limit-id>-limit-name",
          ];

          fn is_codex_quota_response_header(name: &str) -> bool {
              let name = name.trim().to_ascii_lowercase();
              if EXACT_CODEX_QUOTA_RESPONSE_HEADERS.contains(&name.as_str()) {
                  return true;
              }
              if !name.starts_with("x-") {
                  return false;
              }
              CODEX_QUOTA_RESPONSE_HEADER_SUFFIXES.iter().any(|suffix| {
                  name.strip_suffix(suffix)
                      .is_some_and(|family| family.len() > 2 && family.starts_with("x-"))
              })
          }

          fn is_allowed_tunnel_response_header(name: &str) -> bool {
              ALLOWED_TUNNEL_RESPONSE_HEADERS.contains(&name.trim().to_ascii_lowercase().as_str())
          }

          fn is_internal_only_tunnel_response_header(name: &str) -> bool {
              INTERNAL_ONLY_TUNNEL_RESPONSE_HEADERS
                  .contains(&name.trim().to_ascii_lowercase().as_str())
                  || is_codex_quota_response_header(name)
          }

          fn is_explicitly_stripped_tunnel_response_header(name: &str) -> bool {
              EXPLICITLY_STRIPPED_TUNNEL_RESPONSE_HEADERS
                  .contains(&name.trim().to_ascii_lowercase().as_str())
          }

          fn strip_response_encoding(headers: &mut HeaderMap) {
              let keys_to_remove: Vec<HeaderName> = headers
                  .keys()
                  .filter(|name| {
                      let key = name.as_str();
                      is_hop_by_hop(name)
                          || key.starts_with("sec-websocket-")
                          || key.starts_with(CONTROL_PREFIX)
                          || key.starts_with("x-s2s-")
                          || is_explicitly_stripped_tunnel_response_header(key)
                          || !(is_allowed_tunnel_response_header(key)
                              || is_internal_only_tunnel_response_header(key))
                  })
                  .cloned()
                  .collect();
              for key in keys_to_remove {
                  headers.remove(key);
              }
          }

          #[cfg(test)]
          mod response_header_policy_tests {
              use super::*;
              use std::collections::BTreeSet;

              #[test]
              fn response_headers_fail_closed_but_keep_trusted_internal_signals() {
                  let mut headers = HeaderMap::new();
                  headers.insert("content-type", HeaderValue::from_static("application/json"));
                  headers.insert("retry-after", HeaderValue::from_static("18000"));
                  headers.insert("x-request-id", HeaderValue::from_static("req_123"));
                  headers.insert("x-ratelimit-remaining-requests", HeaderValue::from_static("7"));
                  headers.insert("openai-model", HeaderValue::from_static("gpt-5"));
                  headers.insert("x-codex-turn-state", HeaderValue::from_static("turn-state"));
                  headers.insert("x-codex-primary-used-percent", HeaderValue::from_static("89"));
                  headers.insert("x-codex-bengalfox-limit-name", HeaderValue::from_static("sonic"));
                  headers.insert("x-bengalfox-primary-used-percent", HeaderValue::from_static("42"));
                  headers.insert("x-codex-credits-balance", HeaderValue::from_static("9.99"));
                  headers.insert("x-codex-active-limit", HeaderValue::from_static("codex"));
                  headers.insert("cf-ray", HeaderValue::from_static("ray-id"));
                  headers.insert("x-error-json", HeaderValue::from_static("e30="));
                  headers.insert("set-cookie", HeaderValue::from_static("private=1"));
                  headers.insert("x-codex-routing-hint", HeaderValue::from_static("private"));
                  headers.insert("x-future-upstream-header", HeaderValue::from_static("must-drop"));
                  headers.insert("server", HeaderValue::from_static("must-drop"));

                  strip_response_encoding(&mut headers);

                  for kept in [
                      "content-type",
                      "retry-after",
                      "x-request-id",
                      "x-ratelimit-remaining-requests",
                      "openai-model",
                      "x-codex-turn-state",
                      "x-codex-primary-used-percent",
                      "x-codex-bengalfox-limit-name",
                      "x-bengalfox-primary-used-percent",
                      "x-codex-credits-balance",
                      "x-codex-active-limit",
                      "cf-ray",
                      "x-error-json",
                  ] {
                      assert!(headers.contains_key(kept), "expected trusted-hop header {kept} to survive");
                  }
                  for blocked in [
                      "set-cookie",
                      "x-codex-routing-hint",
                      "x-future-upstream-header",
                      "server",
                  ] {
                      assert!(!headers.contains_key(blocked), "expected {blocked} to be stripped");
                  }
              }

              #[test]
              fn audited_codex_response_header_schema_is_fully_classified() {
                  let snapshot_raw = include_str!("../tests/fixtures/codex_wire_snapshot.json");
                  let snapshot: serde_json::Value =
                      serde_json::from_str(snapshot_raw).expect("valid codex wire snapshot");

                  let exact = snapshot
                      .pointer("/response_headers/exact_headers")
                      .and_then(|value| value.as_array())
                      .expect("response_headers.exact_headers");
                  for item in exact {
                      let name = item
                          .get("name")
                          .and_then(|value| value.as_str())
                          .expect("response header name")
                          .to_ascii_lowercase();
                      assert!(
                          is_allowed_tunnel_response_header(&name)
                              || is_internal_only_tunnel_response_header(&name)
                              || is_explicitly_stripped_tunnel_response_header(&name),
                          "audited Codex response header '{name}' is not explicitly classified"
                      );
                  }

                  let snapshot_patterns: BTreeSet<String> = snapshot
                      .pointer("/response_headers/dynamic_header_patterns")
                      .and_then(|value| value.as_array())
                      .expect("response_headers.dynamic_header_patterns")
                      .iter()
                      .map(|item| {
                          item.get("name")
                              .and_then(|value| value.as_str())
                              .expect("response pattern name")
                              .to_ascii_lowercase()
                      })
                      .collect();
                  let code_patterns: BTreeSet<String> = CODEX_QUOTA_RESPONSE_HEADER_PATTERNS
                      .iter()
                      .map(|value| value.to_string())
                      .collect();
                  assert_eq!(
                      code_patterns, snapshot_patterns,
                      "Codex dynamic response-header patterns changed upstream; classify them before forwarding"
                  );
              }
          }

          '''
          main_path.write_text(text[:start] + replacement + text[end:])

          audit_path = Path('scripts/codex_wire_audit.py')
          audit = audit_path.read_text()
          audit = audit.replace(
              '    "safety_buffering": "codex-rs/codex-api/src/safety_buffering.rs",\n}',
              '    "safety_buffering": "codex-rs/codex-api/src/safety_buffering.rs",\n'
              '    "models": "codex-rs/codex-api/src/endpoint/models.rs",\n'
              '    "realtime_call": "codex-rs/codex-api/src/endpoint/realtime_call.rs",\n}'
          )
          audit = audit.replace(
              '    safety = s["safety_buffering"]\n\n    exact = [',
              '    safety = s["safety_buffering"]\n'
              '    models = s["models"]\n'
              '    realtime_call = s["realtime_call"]\n\n'
              '    exact = ['
          )
          audit = audit.replace(
              '        response_header("x-request-id", "upstream request tracking and retry errors", sse, FILES["sse"], \'"x-request-id"\'),\n',
              '        response_header("x-request-id", "upstream request tracking and retry errors", sse, FILES["sse"], \'"x-request-id"\'),\n'
              '        response_header("etag", "model manifest cache validator on GET /models", models, FILES["models"], "get(ETAG)"),\n'
              '        response_header("location", "created realtime call resource URI", realtime_call, FILES["realtime_call"], "get(LOCATION)"),\n'
          )
          audit_path.write_text(audit)

          go_path = Path('backend/internal/util/responseheaders/responseheaders.go')
          go = go_path.read_text()
          go = go.replace(
              '\t"-primary-over-secondary-limit-percent",\n}',
              '\t"-primary-over-secondary-limit-percent",\n\t"-limit-name",\n}'
          )
          go_path.write_text(go)

          test_path = Path('backend/internal/util/responseheaders/responseheaders_test.go')
          test = test_path.read_text()
          test = test.replace(
              '\t\t"X-Codex-Bengalfox-Primary-Used-Percent",\n',
              '\t\t"X-Codex-Bengalfox-Primary-Used-Percent",\n\t\t"X-Codex-Bengalfox-Limit-Name",\n\t\t"X-Bengalfox-Limit-Name",\n'
          )
          test = test.replace(
              '\t\t"X-Bengalfox-Limit-Name",\n\t\t"X-Trace-Limit-Name",\n',
              '\t\t"X-Trace-Label",\n'
          )
          start_test = test.find('func TestFilterHeadersAllowsUnrelatedLimitName')
          if start_test >= 0:
              end_test = test.find('\nfunc ', start_test + 5)
              if end_test < 0:
                  end_test = len(test)
              test = test[:start_test] + test[end_test+1:]
          test_path.write_text(test)
          PY

      - name: Regenerate audited Codex schema
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m py_compile scripts/codex_wire_audit.py
          python3 scripts/codex_wire_audit.py --self-test
          python3 scripts/codex_wire_audit.py --json --output scripts/codex_wire_snapshot.json
          cp scripts/codex_wire_snapshot.json rustsidecar/tests/fixtures/codex_wire_snapshot.json

      - name: Format and test
        run: |
          cargo fmt --manifest-path rustsidecar/Cargo.toml
          cargo test --manifest-path rustsidecar/Cargo.toml
          cd backend
          gofmt -w internal/util/responseheaders/responseheaders.go internal/util/responseheaders/responseheaders_test.go
          go test ./internal/util/responseheaders ./internal/server/middleware ./internal/service/openai_ws_v2

      - name: Commit verified changes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-codex-trusted-response-policy.yml
          git add rustsidecar/src/main.rs scripts/codex_wire_audit.py scripts/codex_wire_snapshot.json rustsidecar/tests/fixtures/codex_wire_snapshot.json backend/internal/util/responseheaders/responseheaders.go backend/internal/util/responseheaders/responseheaders_test.go
          git commit -m "fix(sidecar): preserve trusted quota signals internally"
          git push origin HEAD:fix/codex-quota-egress-isolation
