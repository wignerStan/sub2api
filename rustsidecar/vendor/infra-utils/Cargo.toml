[package]
name = "infra-utils"
version = "0.3.4"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
base64 = "0.22"
hmac = "0.12"
md-5 = "0.10"
regex = "1"
ring = "0.17"
sha2 = "0.10"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
