[package]
edition = "2024"
license = "Apache-2.0"
name = "codex-http-client"
version = "0.0.0"

[dependencies]
native-tls = "0.2"

[lib]
doctest = false

[dependencies.bytes]
version = "1.10.1"

[dependencies.codex-utils-rustls-provider]
path = "../utils-rustls-provider"

[dependencies.futures]
version = "0.3"
default-features = false

[dependencies.http]
version = "1.3.1"

[dependencies.opentelemetry]
version = "0.31.0"

[dependencies.reqwest]
version = "0.12"
features = [ "cookies", "json", "rustls-tls-native-roots", "stream", "socks",]

[dependencies.rustls]
version = "0.23"
features = [ "aws_lc_rs", "std",]
default-features = false

[dependencies.rustls-native-certs]
version = "0.8.3"

[dependencies.rustls-pki-types]
version = "1.14.0"

[dependencies.serde]
version = "1"
features = [ "rc", "derive",]

[dependencies.serde_json]
version = "1"

[dependencies.sha2]
version = "0.10"

[dependencies.thiserror]
version = "2.0.17"

[dependencies.tokio]
version = "1"
features = [ "macros", "rt", "time", "sync",]

[dependencies.tracing]
version = "0.1.44"

[dependencies.tracing-opentelemetry]
version = "0.32.0"

[dependencies.zstd]
version = "0.13"

[dev-dependencies.opentelemetry_sdk]
version = "0.31.0"

[dev-dependencies.pretty_assertions]
version = "1.4.1"

[dev-dependencies.rcgen]
version = "0.14.7"
features = [ "aws_lc_rs", "pem",]
default-features = false

[dev-dependencies.tempfile]
version = "3.23.0"

[dev-dependencies.tracing-subscriber]
version = "0.3.22"

[target."cfg(target_os = \"macos\")".dependencies.system-configuration]
version = "0.7"

[target."cfg(target_os = \"windows\")".dependencies.windows-sys]
version = "0.52"
features = [ "Win32_Foundation", "Win32_Networking_WinHttp",]
